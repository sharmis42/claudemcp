services:
  - type: web
    name: figma-mcp
    runtime: node
    buildCommand: npm install
    startCommand: node --no-deprecation --max-old-space-size=400 node_modules/.bin/tsx src/index.ts
    healthCheckPath: /health
    envVars:
      - key: FIGMA_ACCESS_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
